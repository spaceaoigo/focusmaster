<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tomato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#EE5A5A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECB71"/>
      <stop offset="100%" style="stop-color:#34C759"/>
    </linearGradient>
  </defs>
  
  <!-- Main tomato body -->
  <ellipse cx="256" cy="290" rx="180" ry="170" fill="url(#tomato)"/>
  
  <!-- Highlight -->
  <ellipse cx="200" cy="240" rx="40" ry="30" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Stem -->
  <rect x="246" y="100" width="20" height="40" rx="5" fill="#8B5A2B"/>
  
  <!-- Leaves -->
  <path d="M256 120 Q200 80 180 100 Q200 120 256 120" fill="url(#leaf)"/>
  <path d="M256 120 Q312 80 332 100 Q312 120 256 120" fill="url(#leaf)"/>
  <path d="M256 110 Q256 60 280 50 Q270 80 256 110" fill="url(#leaf)"/>
  <path d="M256 110 Q256 60 232 50 Q242 80 256 110" fill="url(#leaf)"/>
  
  <!-- Timer marks -->
  <circle cx="256" cy="290" r="100" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8"/>
  <line x1="256" y1="200" x2="256" y2="220" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="346" y1="290" x2="326" y2="290" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="380" x2="256" y2="360" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="166" y1="290" x2="186" y2="290" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clock hands -->
  <line x1="256" y1="290" x2="256" y2="230" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="300" y2="310" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="8" fill="white"/>
</svg>
